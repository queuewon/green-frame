<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenFrame</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <main class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="3" />
                <path d="M9 12.5l2 2 4-4.5" />
            </svg>
        </div>

        <h1>Green<span>Frame</span></h1>
        <p class="tagline">Node.js 복기용 http 모듈 활용 자체 제작 간단 웹 프레임워크</p>

        <div class="status">
            <span class="dot"></span>
            서버가 정상적으로 응답하고 있습니다
        </div>

        <footer>served by res.sendFile()</footer>
    </main>

</html>
